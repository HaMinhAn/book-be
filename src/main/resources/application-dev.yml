spring:
  application:
    name: candy
  datasource:
    # MySQL configuration for development
    url: jdbc:mysql://localhost:3307/myappdb
    username: root
    password: my-secret-pw
    driverClassName: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop # For development - recreate schema each time
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

# CORS allowed origins (comma-separated)
app:
  cors:
    allowed-origins: http://localhost:3000

  # Email configuration for development (using a test service like Mailtrap)
  mail:
    host: ${EMAIL_DEV_HOST:smtp.mailtrap.io}
    port: ${EMAIL_DEV_PORT:2525}
    username: ${EMAIL_DEV_USERNAME:your-mailtrap-username}
    password: ${EMAIL_DEV_PASSWORD:your-mailtrap-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

# Configure logging for development
logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    com.example.candy.security: DEBUG
    com.example.candy.security.jwt: DEBUG
    com.example.candy.controllers: DEBUG
    com.example.candy.services.EmailService: DEBUG
    com.example.candy.services.OrderService: DEBUG
    org.springframework.mail: DEBUG
    com.sun.mail: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  jwt:
    secret: bXlTdXBlclNlY3VyZUp3dFNlY3JldEtleUZvckNhbmR5U2hvcEFwcGxpY2F0aW9uMTIzNDU2Nzg5MA==
    expiration: 86400000 # 24 hours in milliseconds
    issuer: candy-book-store
  admin:
    username: admin
    password: admin123
    email: admin@example.com
