spring:
  application:
    name: candy-test
  datasource:
    # H2 for testing with MySQL compatibility mode
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    driverClassName: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    properties:
      hibernate:
        hbm2ddl:
          auto: create-drop

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      continue-on-error: true

# Test configuration
logging:
  level:
    root: WARN
    com.example.candy: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    org.springframework.boot.autoconfigure: ERROR

app:
  jwt:
    secret: dGVzdFNlY3JldEtleUZvclRlc3Rpbmc=
    expiration: 86400000
    issuer: candy-test
  admin:
    username: testadmin
    password: testpass
    email: test@example.com
