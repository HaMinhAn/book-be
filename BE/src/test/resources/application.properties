# Test configuration for H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA/Hibernate configuration for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop
spring.jpa.defer-datasource-initialization=true

# H2 Console (useful for debugging tests)
spring.h2.console.enabled=true

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Logging configuration for tests
logging.level.root=WARN
logging.level.com.example.candy=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.boot.autoconfigure=ERROR

# JWT configuration for tests
app.jwt.secret=dGVzdFNlY3JldEtleUZvclRlc3Rpbmc=
app.jwt.expiration=86400000
app.jwt.issuer=candy-test

# Admin configuration for tests
app.admin.username=testadmin
app.admin.password=testpass
app.admin.email=test@example.com
